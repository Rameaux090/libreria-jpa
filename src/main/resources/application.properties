# === Datos de la aplicación ===
spring.application.name=libreria

# === Servidor ===
server.port=8099

# === Base de datos H2 en memoria ===
# URL JDBC: 'mem' indica base de datos en memoria (se pierde al parar la app).
spring.datasource.url=jdbc:h2:mem:libreriadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# === JPA / Hibernate ===
# PostgreSQL / MySQL usarían 'update' o 'validate' en producción.
# 'create-drop' recrea el esquema en cada arranque (vacía la BD) - útil en H2 de desarrollo.
spring.jpa.hibernate.ddl-auto=create-drop
# Mostrar el SQL generado por Hibernate en consola (útil para depurar / enseñar).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Hibernate entiende y genera SQL concreto del dialecto H2.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Ejecutar data.sql DESPUÉS de que Hibernate cree el esquema (no antes).
spring.jpa.defer-datasource-initialization=true
# Permitir que Spring cargue scripts SQL de inicialización (data.sql, schema.sql).
spring.sql.init.mode=always

# === Consola web H2 ===
# Accesible en http://localhost:8099/h2-console
# JDBC URL: jdbc:h2:mem:libreriadb   User: sa   Password: (vacío)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# === Documentación OpenAPI / Swagger UI ===
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# === Serialización Jackson ===
spring.jackson.default-property-inclusion=non_null

# === Logging ===
logging.level.com.ejemplo.libreria=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# === Tratamiento de errores ===
# Mantenemos el Whitelabel desactivado para que los errores vayan por nuestro
# GlobalExceptionHandler y devuelvan JSON, no la página HTML por defecto.
server.error.whitelabel.enabled=false
